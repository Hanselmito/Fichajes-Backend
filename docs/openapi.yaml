          description: No se pudo generar el QR
          content:
            text/plain:
              schema:
                type: string
    post:
      tags: [QR]
      operationId: generateQrPost
      summary: Generar imagen PNG de un codigo QR por POST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrGeneratorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QrGeneratorRequest'
      responses:
        '200':
          description: Imagen PNG del QR
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Codigo vacio
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: No se pudo generar el QR
          content:
            text/plain:
              schema:
                type: string

  /reports:
    get:
      tags: [Reports]
      operationId: getReports
      summary: Obtener reportes agregados
      parameters:
        - in: query
          name: format
          schema:
            $ref: '#/components/schemas/ReportMode'
      responses:
        '200':
          description: Reporte en formato estadistico, JSON, CSV o texto
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReportStatsResponse'
                  - $ref: '#/components/schemas/ReportJsonResponse'
            text/csv:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string

  /reports/{mode}:
    parameters:
      - in: path
        name: mode
        required: true
        schema:
          $ref: '#/components/schemas/ReportMode'
    get:
      tags: [Reports]
      operationId: getReportsByMode
      summary: Obtener reportes por modo explicito
      responses:
        '200':
          description: Reporte en formato solicitado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReportStatsResponse'
                  - $ref: '#/components/schemas/ReportJsonResponse'
            text/csv:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /work-hours:
    get:
      tags: [WorkHours]
      operationId: getWorkHours
      summary: Obtener horas trabajadas
      parameters:
        - in: query
          name: today
          schema:
            type: boolean
        - in: query
          name: balance
          schema:
            type: boolean
        - in: query
          name: employeeId
          schema:
            type: integer
        - in: query
          name: month
          schema:
            type: string
            example: 2026-05
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Resumen de horas de hoy o balance de horas
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkHoursTodayResponse'
                  - $ref: '#/components/schemas/WorkHoursBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

