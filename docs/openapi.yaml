components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Bearer token

  parameters:
    UserIdPath:
      in: path
      name: userId
      required: true
      schema:
        type: integer
    ZoneIdPath:
      in: path
      name: zoneId
      required: true
      schema:
        type: integer
    ClientIdPath:
      in: path
      name: clientId
      required: true
      schema:
        type: integer
    RecordIdPath:
      in: path
      name: recordId
      required: true
      schema:
        type: integer
    NotificationIdPath:
      in: path
      name: notificationId
      required: true
      schema:
        type: integer
    RequestIdPath:
      in: path
      name: requestId
      required: true
      schema:
        type: integer
    VacationIdPath:
      in: path
      name: vacationId
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Token ausente, invalido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: No autorizado
    Forbidden:
      description: Usuario autenticado sin permisos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Sin permisos
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Error funcional o de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Error de validacion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: API Laravel lista

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    CountMessageResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            count:
              type: integer

    GenericJsonResponse:
      type: object
      additionalProperties: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [success, message, token, user]
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDetails'

    MeResponse:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/UserDetails'

    CapabilitiesResponse:
      type: object
      required: [success, capabilities]
      properties:
        success:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    Capabilities:
      type: object
      required: [user, navigation, resource_access, permissions]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        navigation:
          type: object
          additionalProperties:
            type: boolean
        resource_access:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourceAccess'
        permissions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PermissionCapability'

    ResourceAccess:
      type: object
      required: [visible, manage]
      properties:
        visible:
          type: boolean
        manage:
          type: boolean
        zone_scope:
          type: array
          nullable: true
          items:
            type: integer

    PermissionCapability:
      type: object
      required: [label, allowed, scoped_zone_ids]
      properties:
        label:
          type: string
        allowed:
          type: boolean
        scoped_zone_ids:
