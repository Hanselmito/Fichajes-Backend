openapi: 3.0.3
info:
  title: Fichaje Backend API
  version: 1.1.0
  description: |
    Contrato OpenAPI ampliado del backend Laravel de gestion de fichajes.
    Esta especificacion sirve como base para generar tipos y cliente HTTP en React.
    No cubre aliases `.php` del legacy ni el importador externo.
servers:
  - url: http://localhost:8000/api
    description: Desarrollo local
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Zones
  - name: Clients
  - name: Records
  - name: Notifications
  - name: Breaks
  - name: VacationRequests
  - name: Vacations
  - name: Reports
  - name: WorkHours
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      security: []
      operationId: getHealth
      summary: Healthcheck de la API
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: Iniciar sesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Obtener usuario autenticado
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/capabilities:
    get:
      tags: [Auth]
      operationId: getCapabilities
      summary: Obtener capacidades efectivas para navegacion y guards
      responses:
        '200':
          description: Capacidades del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cerrar sesion logica del cliente
      responses:
        '200':
          description: Logout correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Listar usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      tags: [Users]
      operationId: getUser
      summary: Obtener usuario por id
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      operationId: updateUser
      summary: Actualizar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Eliminar usuario
      responses:
        '200':
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /zones:
    get:
      tags: [Zones]
      operationId: listZones
      summary: Listar zonas
      responses:
        '200':
          description: Lista de zonas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Zones]
      operationId: createZone
      summary: Crear zona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneCreateRequest'
      responses:
        '201':
          description: Zona creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zones-minimal:
    get:
      tags: [Zones]
      operationId: listZonesMinimal
      summary: Listado reducido de zonas
      responses:
        '200':
          description: Zonas reducidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneMinimalListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zones/{zoneId}:
    parameters:
      - $ref: '#/components/parameters/ZoneIdPath'
    get:
      tags: [Zones]
      operationId: getZone
      summary: Obtener zona por id
      responses:
        '200':
          description: Zona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Zones]
      operationId: updateZone
      summary: Actualizar zona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneUpdateRequest'
      responses:
        '200':
          description: Zona actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Zones]
      operationId: deleteZone
      summary: Eliminar zona
      responses:
        '200':
          description: Zona eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /zones/{zoneId}/regenerate-qr:
    parameters:
      - $ref: '#/components/parameters/ZoneIdPath'
    post:
      tags: [Zones]
      operationId: regenerateZoneQr
      summary: Regenerar QR de una zona
      responses:
        '200':
          description: QR regenerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrRegeneratedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: Listar clientes
      parameters:
        - in: query
          name: id
          schema:
            type: integer
        - in: query
          name: week_start
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de clientes o un cliente si se filtra por id
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ClientListResponse'
                  - $ref: '#/components/schemas/ClientResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Clients]
      operationId: createClient
      summary: Crear cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientIdPath'
    get:
      tags: [Clients]
      operationId: getClient
      summary: Obtener cliente por id
      parameters:
        - in: query
          name: week_start
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clients]
      operationId: updateClient
      summary: Actualizar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Clients]
      operationId: deleteClient
      summary: Eliminar cliente
      responses:
        '200':
          description: Cliente eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/geocode:
    post:
      tags: [Clients]
      operationId: geocodeClientAddress
      summary: Geocodificar una direccion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeocodeRequest'
      responses:
        '200':
          description: Coordenadas resueltas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /clients/geocode-all:
    post:
      tags: [Clients]
      operationId: geocodeAllClients
      summary: Geocodificar clientes pendientes
      responses:
        '200':
          description: Proceso de geocodificacion completado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeAllResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clients/qr/{qrCode}:
    parameters:
      - in: path
        name: qrCode
        required: true
        schema:
          type: string
    get:
      tags: [Clients]
      operationId: lookupClientByQr
      summary: Buscar cliente o zona por codigo QR
      responses:
        '200':
          description: Resultado del QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericJsonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}/regenerate-qr:
    parameters:
      - $ref: '#/components/parameters/ClientIdPath'
    post:
      tags: [Clients]
      operationId: regenerateClientQr
      summary: Regenerar QR de un cliente
      responses:
        '200':
          description: QR regenerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrRegeneratedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /records:
    get:
      tags: [Records]
      operationId: listRecords
      summary: Listar fichajes
      parameters:
        - in: query
          name: employeeId
          schema:
            type: integer
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de fichajes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Records]
      operationId: createRecord
      summary: Crear fichaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
      responses:
        '201':
          description: Fichaje creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/RecordIdPath'
    get:
      tags: [Records]
      operationId: getRecord
      summary: Obtener fichaje por id
      responses:
        '200':
          description: Fichaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Records]
      operationId: updateRecord
      summary: Actualizar fichaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordUpdateRequest'
      responses:
        '200':
          description: Fichaje actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: Eliminar fichaje
      responses:
        '200':
          description: Fichaje eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /records/{recordId}/confirm:
    parameters:
      - $ref: '#/components/parameters/RecordIdPath'
    put:
      tags: [Records]
      operationId: confirmRecord
      summary: Confirmar fichaje
      responses:
        '200':
          description: Fichaje confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Listar notificaciones del usuario autenticado
      parameters:
        - in: query
          name: unreadOnly
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Notificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    put:
      tags: [Notifications]
      operationId: readAllNotifications
      summary: Marcar todas las notificaciones como leidas
      responses:
        '200':
          description: Notificaciones marcadas como leidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationIdPath'
    put:
      tags: [Notifications]
      operationId: readNotification
      summary: Marcar una notificacion como leida
      responses:
        '200':
          description: Notificacion marcada como leida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/{notificationId}:
    parameters:
      - $ref: '#/components/parameters/NotificationIdPath'
    delete:
      tags: [Notifications]
      operationId: deleteNotification
      summary: Eliminar una notificacion
      responses:
        '200':
          description: Notificacion eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/settings:
    get:
      tags: [Notifications]
      operationId: getNotificationSettings
      summary: Obtener configuracion de notificaciones
      responses:
        '200':
          description: Configuracion de notificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Notifications]
      operationId: updateNotificationSettings
      summary: Actualizar configuracion de notificaciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsUpdateRequest'
      responses:
        '200':
          description: Configuracion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /breaks:
    get:
      tags: [Breaks]
      operationId: listBreaks
      summary: Listar descansos del dia
      parameters:
        - in: query
          name: employeeId
          schema:
            type: integer
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Descansos del dia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Breaks]
      operationId: startBreak
      summary: Iniciar descanso
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakCreateRequest'
      responses:
        '201':
          description: Descanso iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakStartedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Breaks]
      operationId: finishBreak
      summary: Finalizar descanso en curso
      responses:
        '200':
          description: Descanso finalizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakFinishedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /vacation-requests:
    get:
      tags: [VacationRequests]
      operationId: listVacationRequests
      summary: Listar solicitudes de vacaciones nuevas
      responses:
        '200':
          description: Solicitudes de vacaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [VacationRequests]
      operationId: createVacationRequest
      summary: Crear solicitud de vacaciones nueva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacationRequestCreateRequest'
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequestCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /vacation-requests/stats:
    get:
      tags: [VacationRequests]
      operationId: getVacationRequestStats
      summary: Obtener estadisticas anuales de vacaciones
      parameters:
        - in: query
          name: employeeId
          schema:
            type: integer
        - in: query
          name: year
          schema:
            type: integer
      responses:
        '200':
          description: Estadisticas de vacaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequestStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /vacation-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
